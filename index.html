<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WardOps — Healthcare Coverage Monitor</title>
    <meta name="description" content="WardOps healthcare shift and staffing operations coverage monitoring" />
    <meta http-equiv="refresh" content="0; url=/coverage.html" />
    <script>
      // Immediate client-side redirection to Coverage Monitor
      window.location.replace('/coverage.html');
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #f8fafc;
        color: #334155;
      }
      .redirect-box {
        text-align: center;
        padding: 2rem;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #0d9488;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="redirect-box">
      <div class="spinner"></div>
      <p>Loading WardOps Coverage Monitor...</p>
      <p><small>If you are not redirected automatically, <a href="/coverage.html">click here</a>.</small></p>
    </div>
  </body>
</html>
